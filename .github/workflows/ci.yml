name: SentinelDesk CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t sentineldesk:ci .

      - name: Run Docker container
        run: docker run -d --name sentineldesk-ci -p 3000:3000 sentineldesk:ci

      - name: Smoke test health endpoint
        run: |
          trap 'docker rm -f sentineldesk-ci' EXIT
          curl --fail --retry 10 --retry-delay 2 http://localhost:3000/health